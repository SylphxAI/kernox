name: commit

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: commit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: sylphx-linux-standard
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pinned secret scan walks committed history; a shallow checkout
          # would silently scan only the tip commit.
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Install policy tools
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - name: Install pinned gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, also listed in the
          # release's gitleaks_8.30.1_checksums.txt; both are verified below.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --location --silent --show-error --retry 3 --output "${RUNNER_TEMP}/${archive}" "${base}/${archive}"
          curl --fail --location --silent --show-error --retry 3 --output "${RUNNER_TEMP}/${checksums}" "${base}/${checksums}"
          (cd "${RUNNER_TEMP}" && grep " ${archive}$" "${checksums}" | sha256sum -c -)
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks-bin" gitleaks
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/gitleaks-bin/gitleaks" version
      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.12
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl --retry 3 --retry-connrefused --fail --silent --show-error --location \
            --output "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${archive}" \
            | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/actionlint"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/actionlint" actionlint
          echo "${RUNNER_TEMP}/actionlint" >> "${GITHUB_PATH}"
      - name: Lint workflows
        run: actionlint
      - name: Run repository verification
        run: cargo run --locked -p xtask -- verify
      - name: Compile fuzz boundary
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --bin graph_json

  minimum-rust:
    name: minimum Rust 1.85
    runs-on: sylphx-linux-standard
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install minimum Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0
      - name: Check supported library and binary targets
        run: cargo check --locked --workspace --lib --bins

  semver:
    name: public API compatibility
    runs-on: sylphx-linux-standard
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Detect published predecessor
        id: predecessor
        shell: bash
        run: |
          status="$(curl --retry 3 --silent --show-error --user-agent 'kernox-ci/1.0 (+https://github.com/SylphxAI/kernox)' --output /dev/null --write-out '%{http_code}' https://index.crates.io/ke/rn/kernox)"
          case "${status}" in
            200) echo "exists=true" >> "${GITHUB_OUTPUT}" ;;
            404) echo "exists=false" >> "${GITHUB_OUTPUT}" ;;
            *) echo "unexpected crates.io status ${status}" >&2; exit 1 ;;
          esac
      - name: Compare against published predecessors when present
        if: steps.predecessor.outputs.exists == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: kernox-core,kernox-runtime,kernox-host-serverless,kernox-host-tokio,kernox-testkit,kernox
          rust-toolchain: manual
      - name: Record first-release baseline state
        if: steps.predecessor.outputs.exists == 'false'
        run: echo 'No published kernox predecessor exists; compatibility starts at this release.'

  macos:
    name: macOS portability
    runs-on: [self-hosted, sylphx, macos, standard]
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Test public workspace
        run: cargo test --locked --workspace --all-features
