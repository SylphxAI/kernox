[package]
name = "kernox-clean-consumer"
description = "Standalone consumer smoke application for Kernox"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace]

[dependencies]
futures = "0.3.34"
kernox = { path = "../../crates/kernox", version = "0.1.0", features = ["serverless"] }
kernox-testkit = { path = "../../crates/kernox-testkit", version = "0.1.0" }
semver = { version = "1.0.28", default-features = false, features = ["std"] }

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unused_lifetimes = "deny"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
