[package]
name = "kernox"
description = "Experimental embeddable Rust engine that composes a host and trusted in-process plugins into one deterministic capability graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
serverless = ["dep:kernox-host-serverless"]
tokio = ["dep:kernox-host-tokio"]
full = ["serverless", "tokio"]

[dependencies]
kernox-core.workspace = true
kernox-host-serverless = { path = "../kernox-host-serverless", version = "0.1.1", optional = true }
kernox-host-tokio = { path = "../kernox-host-tokio", version = "0.1.1", optional = true }
kernox-runtime = { path = "../kernox-runtime", version = "0.1.1" }

[dev-dependencies]
criterion.workspace = true
futures.workspace = true
semver.workspace = true

[[bench]]
name = "kernel"
harness = false

[lints]
workspace = true
