[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
    "crates/kernox",
    "crates/cargo-kernox",
    "crates/kernox-core",
    "crates/kernox-host-serverless",
    "crates/kernox-host-tokio",
    "crates/kernox-runtime",
    "crates/kernox-testkit",
    "examples/order-app",
    "xtask",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Sylphx Limited"]
repository = "https://github.com/SylphxAI/kernox"
homepage = "https://github.com/SylphxAI/kernox"
readme = "README.md"
keywords = ["architecture", "dependency-injection", "kernel", "plugin", "runtime"]
categories = ["asynchronous", "config", "development-tools"]

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
criterion = "0.8.2"
futures = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
kernox-core = { path = "crates/kernox-core", version = "1.0.0" }
proptest = "1.11.0"
semver = { version = "1.0.28", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false }
tokio-util = { version = "0.7.19", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unused_lifetimes = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
