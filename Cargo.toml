[workspace]
resolver = "3"
members = ["crates/kernox-core"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Sylphx Limited"]
repository = "https://github.com/SylphxAI/kernox"
homepage = "https://github.com/SylphxAI/kernox"
keywords = ["architecture", "dependency-injection", "kernel", "plugin", "runtime"]
categories = ["asynchronous", "config", "development-tools"]

[workspace.dependencies]
proptest = "1.11.0"
semver = { version = "1.0.28", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unused_lifetimes = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
